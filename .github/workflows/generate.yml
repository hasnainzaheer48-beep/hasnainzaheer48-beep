name: Update GitHub Profile

on:
  push:
    branches:
      - main

  schedule:

    - cron: "0 4 * * *"

  workflow_dispatch:


permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      
      
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

     
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: cache/requirements.txt

     
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r cache/requirements.txt

   
      - name: Generate GitHub profile
        env:
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}
          BIRTHDAY: "2006-08-15"
        run: |
          python generate.py

     
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add dark_mode.svg
          git add light_mode.svg
          git add cache/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub profile stats"
            git push
          fi